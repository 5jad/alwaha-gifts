<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#f6f3ed" />
    <link rel="icon" type="image/svg+xml" href="/watch-mark.svg" />
    <title>متجر الأناقة — ساعات جدارية فاخرة</title>
    <meta name="description" content="متجر الأناقة — ساعات جدارية فخمة بتفاصيل تختارها بعناية. توصيل مجاني والدفع عند الاستلام." />

    <!-- Google Fonts: IBM Plex Sans Arabic & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      
      // Inject pixel ID at build time via Vite replacement %VITE_META_PIXEL_ID%
      var pixelId = '%VITE_META_PIXEL_ID%';
      if (pixelId && pixelId !== '%' + 'VITE_META_PIXEL_ID' + '%' && pixelId.trim() !== '') {
        fbq('init', pixelId.trim());
        fbq('track', 'PageView');
      } else {
        console.warn('[Meta Pixel] VITE_META_PIXEL_ID is not configured in build environment.');
      }
    </script>
    <!-- End Meta Pixel Code -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
